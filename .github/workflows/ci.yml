name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/smoke_test.py needs a deployed AWS stack and is not run here.
      - name: Run unit tests
        run: pytest tests/test_step1_tools.py -v

  templates:
    name: Lint CloudFormation templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      # Warnings (e.g. the deprecated python3.9 Lambda runtime) do not fail the job.
      - name: Lint templates
        run: cfn-lint --non-zero-exit-code error prerequisite/cognito.yaml prerequisite/infrastructure.yaml
